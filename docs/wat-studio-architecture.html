<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>nexia — Arquitetura</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e8eaf6; font-family: 'Fira Code', monospace; }
    #toolbar {
      padding: 8px 16px; display: flex; gap: 8px; align-items: center;
      background: #1a1d27; border-bottom: 1px solid #2e3348;
    }
    #toolbar h1 { font-size: 13px; color: #8b90a8; margin-right: auto; }
    #toolbar button {
      background: #22263a; border: 1px solid #2e3348; color: #e8eaf6;
      border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #2e3348; }
    #cy { width: 100vw; height: calc(100vh - 80px); background: #0f1117; }
    #legend {
      display: flex; gap: 20px; padding: 8px 16px; flex-wrap: wrap;
      background: #1a1d27; border-top: 1px solid #2e3348; font-size: 11px; color: #8b90a8;
    }
    .leg { display: flex; align-items: center; gap: 6px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px; }
    .leg-line { width: 24px; height: 2px; border-radius: 1px; }
  </style>
</head>
<body>

<div id="toolbar">
  <h1>nexia — Arquitetura Completa</h1>
  <button onclick="cy.zoom(cy.zoom()*1.2)">+</button>
  <button onclick="cy.zoom(cy.zoom()*0.8)">−</button>
  <button onclick="cy.fit()">⊡ Fit</button>
</div>

<div id="cy"></div>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#5B8DEF;border:1px solid #5B8DEF"></div> Frontend / Cliente</div>
  <div class="leg"><div class="leg-dot" style="background:#34C759;border:1px solid #34C759"></div> Repos Git</div>
  <div class="leg"><div class="leg-dot" style="background:#C084FC;border:2px solid #C084FC"></div> Agentes IA</div>
  <div class="leg"><div class="leg-dot" style="background:#F5C542;border:1px solid #F5C542"></div> Supabase / Dados</div>
  <div class="leg"><div class="leg-dot" style="background:#29B6D4;border:1px solid #29B6D4"></div> Tools Python</div>
  <div class="leg"><div class="leg-line" style="background:#5B8DEF"></div> HTTP</div>
  <div class="leg"><div class="leg-line" style="background:#C084FC"></div> IA</div>
  <div class="leg"><div class="leg-line" style="background:#F5C542"></div> Storage</div>
  <div class="leg"><div class="leg-line" style="background:#34C759;border-top:2px dashed #34C759;height:0"></div> Lê / Usa</div>
</div>

<script src="https://unpkg.com/cytoscape@3.33.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script src="https://unpkg.com/cytoscape-elk@2.3.0/dist/cytoscape-elk.js"></script>

<script>
cytoscape.use(cytoscapeElk);

var cy = cytoscape({
  container: document.getElementById('cy'),

  elements: [
    // ── LAYER 0: Tenants (Browser) ───────────────────────────────
    { data: { id: 'browser-tenant-a', label: 'Tenant A\nprofissional de saúde', layer: 0, type: 'browser' } },
    { data: { id: 'browser-tenant-n', label: 'Tenant N\n(futuro)', layer: 0, type: 'browser-pub' } },

    // ── LAYER 1: Frontend + Auth ──────────────────────────────────
    { data: { id: 'app-frontend',  label: 'nexia\nFastAPI + HTML/JS', layer: 1, type: 'entry' } },
    { data: { id: 'app-auth',      label: 'Supabase Auth\nMagic Link', layer: 1, type: 'entry' } },

    // ── LAYER 2: Git Repos ────────────────────────────────────────
    { data: { id: 'repo-framework', label: 'nexia\ntools/ · workflows/\nfrontend/ · docs/', layer: 2, type: 'router-crud' } },
    { data: { id: 'repo-client',    label: 'nexia-<slug>\ncontext/ · projects/\nCLAUDE.md', layer: 2, type: 'router-crud' } },
    { data: { id: 'repo-template',  label: 'CLAUDE.template.md\nonboarding\nnovo cliente', layer: 2, type: 'core-config' } },

    // ── LAYER 3: Agentes IA ───────────────────────────────────────
    { data: { id: 'agent-claude',  label: '★ Claude\nOrquestrador\nEntregáveis finais', layer: 3, type: 'core-ai' } },
    { data: { id: 'agent-gemini',  label: '★ Gemini\nResearch · Briefs\nDrafts · Audits', layer: 3, type: 'external' } },

    // ── LAYER 4: Tools ────────────────────────────────────────────
    { data: { id: 'tools-gemini', label: 'call_gemini_api.py\ndispatch → gemini/', layer: 4, type: 'core-rag' } },
    { data: { id: 'tools-media',  label: 'create_reel.py\nffmpeg · yt-dlp', layer: 4, type: 'core-rag' } },
    { data: { id: 'tools-search', label: 'search_web.py\nsearch_youtube.py\nsearch_pubmed.py', layer: 4, type: 'core-rag' } },

    // ── LAYER 5: Data ─────────────────────────────────────────────
    { data: { id: 'db-postgres',  label: 'Supabase PostgreSQL\nRLS por tenant_id\ntenants · profiles\nai_outputs · projects', layer: 5, type: 'data' } },
    { data: { id: 'db-storage',   label: 'Supabase Storage\nnexia/\n<slug>/reels/\n<slug>/projects/', layer: 5, type: 'data' } },
    { data: { id: 'gemini-out',   label: 'gemini/\nbriefs/ · drafts/\nresearch/ · audits/', layer: 5, type: 'core-storage' } },

    // ── EDGES ─────────────────────────────────────────────────────
    // Tenants → Frontend
    { data: { source: 'browser-tenant-a', target: 'app-frontend', type: 'http', label: 'login Magic Link' } },
    { data: { source: 'browser-tenant-n', target: 'app-frontend', type: 'http' } },

    // Frontend → Auth + DB
    { data: { source: 'app-frontend', target: 'app-auth',    type: 'http',    label: 'verifica sessão' } },
    { data: { source: 'app-frontend', target: 'db-postgres', type: 'storage', label: 'RLS: só vê seu tenant' } },

    // Auth → DB
    { data: { source: 'app-auth', target: 'db-postgres', type: 'storage', label: 'auth.uid() → tenant_id' } },

    // Claude lê repos
    { data: { source: 'agent-claude', target: 'repo-framework', type: 'internal', label: 'lê workflows/ e tools/' } },
    { data: { source: 'agent-claude', target: 'repo-client',    type: 'internal', label: 'lê context/ e memoria/' } },

    // Claude delega ao Gemini via tool
    { data: { source: 'agent-claude', target: 'tools-gemini',  type: 'ai',      label: 'pesquisa / volume' } },
    { data: { source: 'tools-gemini', target: 'agent-gemini',  type: 'ai',      label: 'API call' } },
    { data: { source: 'agent-gemini', target: 'gemini-out',    type: 'storage', label: 'salva output' } },
    { data: { source: 'agent-claude', target: 'gemini-out',    type: 'internal', label: 'lê output Gemini' } },

    // Claude usa outras tools
    { data: { source: 'agent-claude', target: 'tools-media',  type: 'ai' } },
    { data: { source: 'agent-claude', target: 'tools-search', type: 'ai' } },

    // Claude → Supabase (entregáveis)
    { data: { source: 'agent-claude', target: 'db-postgres', type: 'storage', label: 'salva projetos / ai_outputs' } },
    { data: { source: 'agent-claude', target: 'db-storage',  type: 'storage', label: 'upload reels · protótipos' } },

    // Template → repo de cliente (onboarding)
    { data: { source: 'repo-template', target: 'repo-client', type: 'internal', label: 'base para onboarding' } },
  ],

  style: [
    {
      selector: 'node',
      style: {
        'label': 'data(label)',
        'text-valign': 'center', 'text-halign': 'center',
        'font-family': 'Fira Code, monospace', 'font-size': '11px',
        'color': '#e8eaf6', 'text-wrap': 'wrap', 'text-max-width': '150px',
        'width': 'label', 'height': 'label', 'padding': '14px',
        'shape': 'round-rectangle',
        'background-color': '#1a1d27', 'border-color': '#2e3348', 'border-width': 1,
      }
    },
    { selector: 'node[type="browser"]',      style: { 'background-color': '#1a2a3a', 'border-color': '#5B8DEF', 'border-width': 2 } },
    { selector: 'node[type="browser-pub"]',  style: { 'background-color': '#151e2a', 'border-color': '#5B8DEF', 'border-width': 1, 'border-style': 'dashed', 'color': '#8b90a8' } },
    { selector: 'node[type="entry"]',        style: { 'background-color': '#1a2a1a', 'border-color': '#34C759', 'border-width': 2, 'font-weight': 'bold' } },
    { selector: 'node[type="router-crud"]',  style: { 'background-color': '#1a2a1a', 'border-color': '#34C759', 'border-width': 1 } },
    { selector: 'node[type="core-config"]',  style: { 'background-color': '#1a2215', 'border-color': '#34C759', 'border-style': 'dashed' } },
    { selector: 'node[type="core-ai"]',      style: { 'background-color': '#2a1a3a', 'border-color': '#C084FC', 'border-width': 3 } },
    { selector: 'node[type="external"]',     style: { 'background-color': '#2a1a2a', 'border-color': '#C084FC', 'border-width': 2 } },
    { selector: 'node[type="core-rag"]',     style: { 'background-color': '#1a2a3a', 'border-color': '#29B6D4', 'border-width': 1 } },
    { selector: 'node[type="core-storage"]', style: { 'background-color': '#2a2000', 'border-color': '#F5C542', 'border-width': 1 } },
    { selector: 'node[type="data"]',         style: { 'background-color': '#1f1a0a', 'border-color': '#F5C542', 'border-width': 2 } },

    {
      selector: 'edge',
      style: {
        'curve-style': 'bezier', 'target-arrow-shape': 'triangle',
        'width': 1.5, 'line-color': '#3a3f5a', 'target-arrow-color': '#3a3f5a',
        'font-size': '9px', 'color': '#8b90a8',
        'text-background-color': '#0f1117', 'text-background-opacity': 1,
        'text-background-padding': '2px',
      }
    },
    { selector: 'edge[label]',            style: { 'label': 'data(label)' } },
    { selector: 'edge[type="http"]',      style: { 'line-color': '#5B8DEF', 'target-arrow-color': '#5B8DEF', 'width': 2 } },
    { selector: 'edge[type="ai"]',        style: { 'line-color': '#C084FC', 'target-arrow-color': '#C084FC', 'width': 2 } },
    { selector: 'edge[type="storage"]',   style: { 'line-color': '#F5C542', 'target-arrow-color': '#F5C542', 'width': 1.5 } },
    { selector: 'edge[type="internal"]',  style: { 'line-color': '#34C759', 'target-arrow-color': '#34C759', 'width': 1, 'line-style': 'dashed', 'opacity': 0.6 } },
  ],

  layout: {
    name: 'elk',
    elk: {
      algorithm: 'layered',
      'elk.direction': 'DOWN',
      'elk.layered.crossingMinimization.strategy': 'LAYER_SWEEP',
      'elk.layered.nodePlacement.strategy': 'BRANDES_KOEPF',
      'elk.spacing.nodeNode': '40',
      'elk.layered.spacing.nodeNodeBetweenLayers': '90',
      'elk.partitioning.activate': 'true',
      'elk.padding': '[top=40,left=40,bottom=40,right=40]',
    },
    nodeLayoutOptions: (node) => ({
      'elk.partitioning.partition': String(node.data('layer')),
    }),
  },
});

cy.on('layoutstop', () => cy.fit(undefined, 40));
</script>

</body>
</html>
