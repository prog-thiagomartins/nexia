<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayara Farias · Nutricionista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:   #FAF7F2;
      --sage:    #6B7B5E;
      --sage-light: #EDF0E8;
      --caramel: #C8A882;
      --dark:    #2C2C2C;
      --mid:     #6B6B6B;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      background: var(--cream);
      color: var(--dark);
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sage);
      background: var(--sage-light);
      padding: 6px 14px;
      border-radius: 100px;
      margin-bottom: 32px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.6rem, 7vw, 4.8rem);
      line-height: 1.15;
      color: var(--dark);
      margin-bottom: 24px;
    }

    h1 em {
      font-style: italic;
      color: var(--caramel);
    }

    p {
      font-size: 1.05rem;
      color: var(--mid);
      max-width: 380px;
      line-height: 1.7;
      margin: 0 auto 48px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--caramel);
      border: none;
      margin: 0 auto 48px;
      opacity: 0.6;
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--dark);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 14px 28px;
      border-radius: 100px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .instagram-link:hover { opacity: 0.82; }

    .instagram-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    footer {
      position: fixed;
      bottom: 28px;
      font-size: 0.75rem;
      color: var(--mid);
      opacity: 0.55;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <span class="tag">Em breve</span>

  <h1>Mayara Farias<br><em>Nutricionista</em></h1>

  <p>Site em construção. Enquanto isso, me acompanhe no Instagram para conteúdo sobre nutrição na gestação e saúde feminina.</p>

  <hr class="divider">

  <footer>© 2026 Mayara Farias · Nutricionista</footer>

</body>
</html>
